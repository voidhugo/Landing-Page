<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro Administrativo | K.Artes</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS da K.Artes -->
    <link rel="stylesheet" href="assets/css/custom.css">
</head>

<body class="login-page">

    <main class="login-container">

        <div class="login-card cadastro-card">

            <div class="text-center mb-4">

                <img
                    src="assets/images/logo.png"
                    alt="Logo da K.Artes"
                    class="login-logo">

                <h1>Cadastro Administrativo</h1>

                <p>
                    Crie uma conta para gerenciar os produtos da K.Artes.
                </p>

            </div>


            <form>

                <div class="mb-3">

                    <label for="nome" class="form-label">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required>

                </div>


                <div class="mb-3">

                    <label for="email" class="form-label">
                        E-mail
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required>

                </div>


                <div class="mb-3">

                    <label for="senha" class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        name="senha"
                        placeholder="Mínimo de 8 caracteres"
                        minlength="8"
                        required>

                </div>


                <div class="mb-3">

                    <label for="confirmar-senha" class="form-label">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Confirme sua senha"
                        minlength="8"
                        required>

                </div>


                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="termos"
                        required>

                    <label
                        class="form-check-label"
                        for="termos">

                        Aceito os Termos de Uso

                    </label>

                </div>


                <button
                    type="submit"
                    class="btn btn-login w-100">

                    Criar conta de administrador

                </button>


                <div class="text-center mt-4">

                    <p class="mb-1">
                        Já possui uma conta?
                    </p>

                    <a
                        href="login.html"
                        class="register-link">

                        Voltar para o Login

                    </a>

                </div>


                <div class="text-center mt-4">

                    <a
                        href="index.html"
                        class="back-link">

                        ← Voltar para o site

                    </a>

                </div>

            </form>

        </div>

    </main>


    <footer class="login-footer">

        <p class="mb-0">
            &copy; 2026 K.Artes. Todos os direitos reservados.
        </p>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
